<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monitor Lab</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 700px; margin: 0 auto; }
    .card { background: #111827; border-radius: 12px; padding: 18px; margin: 12px 0; }
    .value { font-size: 28px; font-weight: bold; }
    .ok { color: #4ade80; }
    .alert { color: #f87171; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <h1>Monitoramento do Laboratório</h1>
  <div class="card">
    <div>Temperatura</div>
    <div class="value ok">-- °C</div>
  </div>
  <div class="card">
    <div>Umidade</div>
    <div class="value ok">-- %</div>
  </div>
  <div class="card">
    <div>Gás</div>
    <div class="value ok">-- ADC</div>
  </div>
  <p><strong>Status Wi‑Fi:</strong> aguardando conexão</p>
  <p><a href="/setup">Configurar rede Wi‑Fi</a></p>
</body>
</html>
